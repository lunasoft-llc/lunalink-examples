name: Bug report
description: Report a reproducible problem in a LunaLink example.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Remove secrets and private infrastructure details before submitting.
  - type: dropdown
    id: example
    attributes:
      label: Example
      options: [Master, Node, Both]
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      description: LunaLink, .NET, and Windows versions.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: Tell us exactly how to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      render: shell
